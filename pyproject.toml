[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meridianforge"
version = "0.1.1"
description = "AI-assisted real estate underwriting platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Meridian Forge Team" }
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[project.scripts]
meridianforge = "meridianforge.cli.main:main"
